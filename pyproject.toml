[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "patchex"
version = "1.0.0"
description = "Interpretable prediction of enzyme optimal temperature and optimal pH"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=1.13",
    "transformers>=4.25",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["accelerate>=0.20"]

[project.scripts]
patchex-predict = "patchex.cli:main"

[tool.setuptools]
packages = ["patchex"]
